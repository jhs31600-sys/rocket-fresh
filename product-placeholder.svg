:root {
  --bg: #f4f6fb;
  --ink: #111827;
  --muted: #667085;
  --line: #e2e7ef;
  --panel: #ffffff;
  --accent: #1967ff;
  --accent-dark: #0d48c8;
  --green: #087a4d;
  --orange: #b45309;
  --red: #b42318;
  --soft-blue: #eaf1ff;
  --soft-green: #e9f8f1;
  --soft-orange: #fff7e8;
  --shadow: 0 22px 70px rgba(16, 24, 40, 0.09);
  --radius-xl: 32px;
  --radius-lg: 24px;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  background:
    radial-gradient(circle at 7% 0%, rgba(53, 111, 255, 0.15), transparent 29rem),
    radial-gradient(circle at 95% 18%, rgba(79, 209, 159, 0.10), transparent 24rem),
    var(--bg);
  color: var(--ink);
}
button, input, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
a { color: inherit; }
.hidden { display: none !important; }

.skip-link {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 999;
  transform: translateY(-150%);
  background: #111827;
  color: #fff;
  padding: 10px 14px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 800;
}
.skip-link:focus { transform: translateY(0); }

.shell {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 44px 0 max(68px, env(safe-area-inset-bottom));
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 34px;
  align-items: end;
  margin-bottom: 30px;
}
.hero-kicker {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
  font-weight: 900;
  letter-spacing: -0.02em;
}
.brand-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 7px rgba(25, 103, 255, 0.12); margin-right: 3px; }
.unofficial { color: var(--muted); background: rgba(255,255,255,.65); border: 1px solid var(--line); border-radius: 999px; padding: 6px 9px; font-size: 11px; }
h1 {
  margin: 0;
  font-size: clamp(42px, 6.7vw, 78px);
  letter-spacing: -0.075em;
  line-height: 0.98;
  max-width: 820px;
}
.hero-copy {
  margin: 20px 0 0;
  color: var(--muted);
  font-size: 18px;
  line-height: 1.65;
  max-width: 720px;
  word-break: keep-all;
}
.hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.privacy-chip { color: #475467; font-weight: 750; font-size: 13px; }

.hero-card {
  background: #111827;
  color: white;
  border-radius: 30px;
  padding: 26px;
  box-shadow: 0 22px 60px rgba(17, 24, 39, .20);
}
.hero-card > span, .hero-card > small { color: rgba(255,255,255,.68); display: block; }
.hero-card > strong { display: block; font-size: 40px; letter-spacing: -0.05em; margin: 8px 0; }
.api-state { display: flex; align-items: center; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.76); font-size: 12px; font-weight: 800; }
.state-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
.api-state[data-state="connected"] .state-dot { background: #34d399; }
.api-state[data-state="fallback"] .state-dot { background: #94a3b8; }
.api-state[data-state="error"] .state-dot { background: #fb7185; }

.grid {
  display: grid;
  grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
  gap: 22px;
  align-items: start;
}
.panel, .explain {
  background: rgba(255,255,255,.94);
  border: 1px solid rgba(226,231,239,.92);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
}
.panel { padding: 25px; }
.panel-head { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 20px; }
.eyebrow { margin: 0 0 7px; color: var(--accent); font-weight: 900; letter-spacing: .09em; text-transform: uppercase; font-size: 11px; }
h2 { margin: 0; font-size: 27px; letter-spacing: -0.045em; }

.field { display: grid; gap: 8px; margin-bottom: 18px; color: var(--muted); font-weight: 800; }
.money-input { position: relative; display: block; }
.money-input b { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #98a2b3; }
.money-input input { padding-right: 45px; }
.field input, .quick-box textarea, .cart-name, .cart-price, .cart-qty {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 15px;
  padding: 13px 14px;
  color: var(--ink);
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.field input:focus, .quick-box textarea:focus, .cart-name:focus, .cart-price:focus, .cart-qty:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(25, 103, 255, .12);
}
.quick-box { border: 1px dashed #cbd5e1; background: #f8fafc; border-radius: 21px; padding: 14px; margin-bottom: 18px; }
.quick-box label { display: block; margin-bottom: 8px; color: var(--muted); font-weight: 850; }
.quick-box textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
.quick-box button { margin-top: 10px; width: 100%; }

.cart-table { display: grid; gap: 8px; }
.table-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 68px 48px; gap: 8px; align-items: center; }
.table-head { color: var(--muted); font-size: 12px; font-weight: 850; padding: 0 4px; }
.remove-row { border: 0; background: #f1f5f9; color: #64748b; border-radius: 14px; height: 46px; font-size: 22px; }
.remove-row:hover { background: #fee2e2; color: var(--red); }

.actions { display: flex; gap: 10px; margin-top: 18px; }
button, .link-button {
  border: 0;
  background: var(--accent);
  color: #fff;
  border-radius: 15px;
  min-height: 46px;
  padding: 12px 16px;
  font-weight: 900;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform .12s ease, background .12s ease;
}
button:hover, .link-button:hover { background: var(--accent-dark); }
button:active, .link-button:active { transform: translateY(1px); }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid rgba(25, 103, 255, .28); outline-offset: 2px; }
button[disabled] { cursor: not-allowed; opacity: .58; }
.secondary { background: #eef2f7; color: #334155; }
.secondary:hover { background: #e2e8f0; }
.ghost { background: #f2f5fb; color: #334155; }
.ghost:hover { background: #e8edf6; }
.compact { min-height: 40px; padding: 9px 12px; font-size: 13px; }

.status-card { background: linear-gradient(135deg, var(--soft-blue), #fff 61%); border: 1px solid #d8e5ff; border-radius: 25px; padding: 18px; margin-bottom: 14px; }
.status-line { display: flex; justify-content: space-between; align-items: center; font-weight: 900; }
.progress { height: 13px; background: rgba(25,103,255,.12); border-radius: 999px; overflow: hidden; margin: 12px 0 16px; }
.progress span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .25s ease; }
.status-grid { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 10px; }
.status-grid div { background: rgba(255,255,255,.76); border: 1px solid rgba(255,255,255,.96); border-radius: 17px; padding: 12px; min-width: 0; }
.status-grid span { display: block; color: var(--muted); font-size: 11px; font-weight: 850; margin-bottom: 6px; }
.status-grid strong { display: block; overflow: hidden; text-overflow: ellipsis; font-size: 17px; letter-spacing: -.025em; }
.ready { background: var(--soft-green); border: 1px solid #bcebd5; color: var(--green); border-radius: 17px; padding: 12px 14px; font-weight: 800; margin-bottom: 12px; line-height: 1.45; }
.api-notice { background: #f8fafc; border: 1px solid var(--line); color: #475467; border-radius: 17px; padding: 11px 13px; font-size: 12px; font-weight: 760; line-height: 1.5; margin-bottom: 14px; }
.api-notice.connected { background: var(--soft-green); border-color: #bcebd5; color: var(--green); }
.api-notice.fallback { background: #f8fafc; }
.api-notice.error { background: #fff1f1; border-color: #ffd2d2; color: var(--red); }

.cards { display: grid; gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 23px; padding: 18px; background: #fff; }
.card-top { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
.card h3 { margin: 0; font-size: 21px; letter-spacing: -.04em; }
.score { background: #eef4ff; color: var(--accent); padding: 8px 10px; border-radius: 999px; font-weight: 900; white-space: nowrap; font-size: 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 7px; margin: 12px 0; }
.meta span { background: #f8fafc; border: 1px solid #e2e8f0; color: #475569; border-radius: 999px; padding: 7px 9px; font-size: 11px; font-weight: 850; }
.card > p { margin: 0 0 12px; color: #475569; line-height: 1.58; word-break: keep-all; }
.recipe { color: #344054; font-weight: 850; margin-bottom: 14px; font-size: 13px; }
.card-actions { display: flex; gap: 9px; flex-wrap: wrap; }
.card-actions .link-button, .card-actions button { min-height: 42px; padding: 10px 13px; font-size: 13px; }
.link-button.secondary { color: #334155; }
.live-products { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.live-products-title { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 10px; }
.live-products-title strong { font-size: 14px; }
.live-products-title small { color: var(--muted); }
.product-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.product-card { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px; border: 1px solid var(--line); border-radius: 17px; padding: 9px; text-decoration: none; background: #fff; min-width: 0; }
.product-card:hover { border-color: #a9c5ff; box-shadow: 0 8px 24px rgba(25,103,255,.08); }
.product-card img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; background: #f1f5f9; }
.product-card b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: 12px; line-height: 1.4; }
.product-price { display: block; margin-top: 5px; color: var(--red); font-size: 15px; font-weight: 950; }
.product-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.product-badges span { color: var(--accent); background: #edf4ff; border-radius: 999px; padding: 3px 6px; font-size: 9px; font-weight: 900; }
.loading-box, .empty-box { background: #f8fafc; color: var(--muted); border-radius: 15px; padding: 14px; text-align: center; font-size: 13px; font-weight: 800; }

.fallbacks { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.fallbacks h3 { margin: 0 0 10px; font-size: 16px; }
#fallbackLinks { display: flex; gap: 8px; flex-wrap: wrap; }
#fallbackLinks a { color: var(--accent); background: #f1f5ff; border-radius: 999px; padding: 9px 11px; text-decoration: none; font-weight: 900; font-size: 12px; }

.explain { margin-top: 22px; padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 22px; }
.explain p:not(.eyebrow) { margin: 10px 0 0; color: var(--muted); line-height: 1.6; word-break: keep-all; }
.rules { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 310px; }
.rules span { background: #111827; color: #fff; border-radius: 999px; padding: 9px 12px; font-weight: 900; font-size: 12px; }

.site-footer { margin-top: 20px; padding: 20px 4px 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
.site-footer p { margin: 0 0 8px; }
.site-footer strong { color: #344054; }
.site-footer nav { display: flex; gap: 14px; margin-top: 10px; }
.site-footer a { color: #475467; font-weight: 850; }
.affiliate-disclosure { color: #7c4a03; }

.toast { position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: #111827; color: #fff; border-radius: 999px; padding: 12px 16px; box-shadow: var(--shadow); font-weight: 850; z-index: 50; max-width: calc(100% - 24px); text-align: center; }

.policy-shell { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 80px; }
.policy-shell .back-link { display: inline-block; margin-bottom: 24px; color: var(--accent); font-weight: 900; }
.policy-card { background: #fff; border: 1px solid var(--line); border-radius: 28px; padding: clamp(22px, 5vw, 42px); box-shadow: var(--shadow); }
.policy-card h1 { font-size: clamp(36px, 7vw, 58px); margin-bottom: 16px; }
.policy-card h2 { margin-top: 30px; font-size: 21px; }
.policy-card p, .policy-card li { color: #475467; line-height: 1.75; }
.policy-card ul { padding-left: 20px; }
.policy-date { color: var(--muted); font-size: 13px; font-weight: 800; }

@media (max-width: 940px) {
  .hero, .grid { grid-template-columns: 1fr; }
  .hero-card { max-width: none; }
  .explain { grid-template-columns: 1fr; }
  .rules { justify-content: flex-start; max-width: none; }
}
@media (max-width: 680px) {
  .shell { width: min(100% - 20px, 1180px); padding-top: 24px; }
  .hero { gap: 20px; }
  h1 { font-size: clamp(42px, 14vw, 66px); }
  .hero-copy { font-size: 16px; }
  .panel { padding: 16px; border-radius: 24px; }
  .table-head { display: none; }
  #cartRows { display: grid; gap: 12px; }
  .table-row[data-index] { grid-template-columns: minmax(0, 1fr) 92px 48px; background: #f8fafc; border: 1px solid var(--line); border-radius: 18px; padding: 10px; }
  .table-row[data-index] .cart-name { grid-column: 1 / -1; }
  .remove-row { height: 44px; }
  .status-grid { grid-template-columns: 1fr 1fr; }
  .status-grid div:last-child { grid-column: 1 / -1; }
  .card-top { flex-direction: column; }
  .score { align-self: flex-start; }
  .actions { flex-direction: column; }
  .product-grid { grid-template-columns: 1fr; }
  .explain { border-radius: 24px; padding: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
